apiVersion: v1
kind: ConfigMap
metadata:
  name: rust-api-config
  namespace: proyecto3
data:
  RUST_LOG: "info"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api
  namespace: proyecto3
  labels:
    app: rust-api
spec:
  replicas: 1  # Will be controlled by HPA
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      imagePullSecrets:
      - name: zot-credentials
      containers:
      - name: api
        image: 34.16.70.73:5000/api-rust:201901271
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: rust-api-config
        env:
        - name: GO_API_CLIENT_URL
          value: "http://go-api-client:8080/report"

---
apiVersion: v1
kind: Service
metadata:
  name: rust-api
  namespace: proyecto3
  labels:
    app: rust-api
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: rust-api
