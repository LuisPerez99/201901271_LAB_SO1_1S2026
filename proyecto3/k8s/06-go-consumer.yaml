apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-consumer
  namespace: proyecto3
  labels:
    app: go-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-consumer
  template:
    metadata:
      labels:
        app: go-consumer
    spec:
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done
      containers:
      - name: consumer
        image: go-consumer:201901271
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: RABBITMQ_ADDR
          value: "rabbitmq:5672"
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASS
          value: "guest"
        - name: RABBITMQ_VHOST
          value: "warreports"
        - name: VALKEY_ADDR
          value: "valkey-svc:6379"
        - name: VALKEY_PASS
          value: ""
        - name: CONSUMER_COUNTRY
          value: "usa"
