apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: valkey-vm
  namespace: proyecto3
  labels:
    app: valkey-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: valkey-vm
        kubevirt.io/domain: valkey-vm
    spec:
      domain:
        devices:
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: emptydisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: valkey
                  port: 6379
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            image: quay.io/kubevirt/alpine-container-disk-demo:devel
        - name: emptydisk
          emptyDisk:
            capacity: 5Gi

