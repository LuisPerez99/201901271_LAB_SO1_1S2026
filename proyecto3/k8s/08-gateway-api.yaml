apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: project-gateway
  namespace: proyecto3
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: war-reports-route
  namespace: proyecto3
spec:
  parentRefs:
  - name: project-gateway
    namespace: proyecto3
  rules:
  - backendRefs:
    - name: rust-api
      port: 3000
