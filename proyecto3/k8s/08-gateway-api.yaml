apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: GatewayClass
metadata:
  name: standard
spec:
  controllerName: io.k8s.gateway/standard

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: project-gateway
  namespace: proyecto3
spec:
  gatewayClassName: standard
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: war-reports-route
  namespace: proyecto3
spec:
  parentRefs:
  - name: project-gateway
    namespace: proyecto3
  hostnames:
  - "*"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /grpc-201901271
    backendRefs:
    - name: rust-api
      port: 3000
  - matches:
    - path:
        type: PathPrefix
        value: /health
    backendRefs:
    - name: rust-api
      port: 3000
