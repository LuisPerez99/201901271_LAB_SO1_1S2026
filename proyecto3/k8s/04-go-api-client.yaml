apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-client
  namespace: proyecto3
  labels:
    app: go-api-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api-client
  template:
    metadata:
      labels:
        app: go-api-client
    spec:
      containers:
      - name: api-client
        image: zot:5000/go-api-client:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: HTTP_PORT
          value: ":8080"
        - name: GRPC_SERVER_ADDR
          value: "go-grpc-server:50051"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: go-api-client
  namespace: proyecto3
  labels:
    app: go-api-client
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: go-api-client
