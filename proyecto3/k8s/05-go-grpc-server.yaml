apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-grpc-server
  namespace: proyecto3
  labels:
    app: go-grpc-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-grpc-server
  template:
    metadata:
      labels:
        app: go-grpc-server
    spec:
      containers:
      - name: grpc-server
        image: zot:5000/go-grpc-server:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: GRPC_PORT
          value: ":50051"
        - name: RABBITMQ_ADDR
          value: "rabbitmq:5672"
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASS
          value: "guest"
        - name: RABBITMQ_VHOST
          value: "/warreports"

---
apiVersion: v1
kind: Service
metadata:
  name: go-grpc-server
  namespace: proyecto3
  labels:
    app: go-grpc-server
spec:
  type: ClusterIP
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    app: go-grpc-server
