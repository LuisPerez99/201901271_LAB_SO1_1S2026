apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-grpc-server
  namespace: proyecto3
  labels:
    app: go-grpc-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-grpc-server
  template:
    metadata:
      labels:
        app: go-grpc-server
    spec:
      imagePullSecrets:
      - name: zot-credentials
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done
      containers:
      - name: grpc-server
        image: 34.16.70.73:5000/go-grpc-server:201901271
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
          name: grpc
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: GRPC_PORT
          value: ":50051"
        - name: RABBITMQ_ADDR
          value: "rabbitmq:5672"
        - name: RABBITMQ_USER
          value: "guest"
        - name: RABBITMQ_PASS
          value: "guest"
        - name: RABBITMQ_VHOST
          value: "warreports"
      - name: grpc-server-sidecar
        image: 34.16.70.73:5000/go-grpc-server:201901271
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - "trap : TERM INT; sleep infinity & wait"
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi

---
apiVersion: v1
kind: Service
metadata:
  name: go-grpc-server
  namespace: proyecto3
  labels:
    app: go-grpc-server
spec:
  type: ClusterIP
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
  selector:
    app: go-grpc-server
