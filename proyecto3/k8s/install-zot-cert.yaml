apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: install-zot-cert
  namespace: proyecto3
  labels:
    name: install-zot-cert
spec:
  selector:
    matchLabels:
      name: install-zot-cert
  template:
    metadata:
      labels:
        name: install-zot-cert
    spec:
      hostPID: true
      hostNetwork: true
      initContainers:
      - name: install-cert
        image: alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            apk add --no-cache curl
            # Esperar a que containerd esté listo
            sleep 5
            # Configurar containerd para confiar en el certificado autofirmado
            # Crear directorio de configuración si no existe
            mkdir -p /tmp/containerd-config
            # Para GKE, necesitamos configurar el registro en containerd.conf.toml
            # Alternativamente, podemos deshabilitar la verificación SSL para Zot
            echo "Esperando a que las imágenes se descarguen..."
            sleep infinity
        volumeMounts:
        - name: zot-cert-vol
          mountPath: /tmp/zot.crt
          subPath: zot.crt
        securityContext:
          privileged: true
      containers:
      - name: sleep
        image: gcr.io/google-containers/pause:3.2
      volumes:
      - name: zot-cert-vol
        secret:
          secretName: zot-ca-cert
      - name: node-certs
        hostPath:
          path: /usr/local/share/ca-certificates
      - name: host-systemctl
        hostPath:
          path: /usr/bin/systemctl