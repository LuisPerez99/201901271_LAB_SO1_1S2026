apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: install-zot-cert
  namespace: proyecto3
  labels:
    name: install-zot-cert
spec:
  selector:
    matchLabels:
      name: install-zot-cert
  template:
    metadata:
      labels:
        name: install-zot-cert
    spec:
      hostPID: true
      hostNetwork: true
      initContainers:
      - name: install-cert
        image: alpine:3.20
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            mkdir -p /host/etc/containerd/certs.d/34.16.70.73:5000
            cp /zot-cert/ca.crt /host/etc/containerd/certs.d/34.16.70.73:5000/ca.crt
            cat <<EOF > /host/etc/containerd/certs.d/34.16.70.73:5000/hosts.toml
            server = "https://34.16.70.73:5000"

            [host."https://34.16.70.73:5000"]
              capabilities = ["pull", "resolve"]
            EOF
            nsenter -t 1 -m -u -i -n -- systemctl restart containerd
            echo "Zot CA instalado en el nodo"
            sleep infinity
        volumeMounts:
        - name: zot-cert-vol
          mountPath: /zot-cert
          readOnly: true
        - name: host-certs
          mountPath: /host/etc/containerd/certs.d
        securityContext:
          privileged: true
      containers:
      - name: sleep
        image: gcr.io/google-containers/pause:3.2
      volumes:
      - name: zot-cert-vol
        secret:
          secretName: zot-ca-cert
      - name: host-certs
        hostPath:
          path: /etc/containerd/certs.d