apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: proyecto3
  labels:
    app: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:7.2-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-svc
  namespace: proyecto3
  labels:
    app: valkey
spec:
  type: ClusterIP
  selector:
    app: valkey
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
